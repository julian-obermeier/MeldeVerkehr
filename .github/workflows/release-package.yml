name: Release Package

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, mbstring, fileinfo, openssl, gd

      - name: Lint release PHP
        run: |
          set -euo pipefail
          while IFS= read -r file; do
            php -l "$file" >/dev/null
          done < <(find app bootstrap config database install public resources routes -type f -name '*.php' | sort)
          php -l maintenance.php >/dev/null
          php -l cron.php >/dev/null

      - name: Build shared-hosting package
        run: |
          set -euo pipefail
          VERSION=$(tr -d '\r\n' < VERSION)
          OUT="MeldeVerkehr-${VERSION}"
          mkdir -p "dist/${OUT}"

          rsync -a ./ "dist/${OUT}/" \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='dist/' \
            --exclude='.env' \
            --exclude='tests/' \
            --exclude='storage/app/*' \
            --exclude='storage/backups/*' \
            --exclude='storage/logs/*'

          mkdir -p "dist/${OUT}/storage/app" "dist/${OUT}/storage/backups" "dist/${OUT}/storage/logs"
          touch "dist/${OUT}/storage/app/.gitkeep" "dist/${OUT}/storage/backups/.gitkeep" "dist/${OUT}/storage/logs/.gitkeep"

          (
            cd dist
            zip -qr "${OUT}.zip" "${OUT}"
            sha256sum "${OUT}.zip" > "${OUT}.zip.sha256"
          )

      - name: Verify package excludes runtime secrets
        run: |
          set -euo pipefail
          ZIP=$(find dist -maxdepth 1 -name '*.zip' -print -quit)
          unzip -l "$ZIP" > /tmp/package-list.txt

          if grep -E '(^|[[:space:]])[^[:space:]]*/\.env$' /tmp/package-list.txt; then
            echo "Release package contains .env"
            exit 1
          fi

          if grep -E '/storage/(app|backups|logs)/[^/[:space:]]+' /tmp/package-list.txt | grep -v '\.gitkeep$'; then
            echo "Release package contains runtime data"
            exit 1
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: meldeverkehr-release-package
          path: |
            dist/*.zip
            dist/*.sha256
          if-no-files-found: error
